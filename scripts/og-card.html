<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=block"
  rel="stylesheet"
/>
<style>
  :root {
    --paper: oklch(0.958 0.011 82);
    --paper-3: oklch(0.914 0.014 79);
    --card: oklch(0.98 0.007 84);
    --ink: oklch(0.25 0.016 64);
    --ink-muted: oklch(0.46 0.015 64);
    --cobalt: oklch(0.52 0.247 266);
    --cobalt-deep: oklch(0.44 0.214 266);
    --line: oklch(0.25 0.016 64 / 0.16);
    --line-strong: oklch(0.25 0.016 64 / 0.34);
    --line-cobalt: oklch(0.52 0.247 266 / 0.5);
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(55% 60% at 82% 30%, oklch(0.52 0.247 266 / 0.09) 0%, transparent 62%),
      radial-gradient(45% 55% at 10% 95%, oklch(0.914 0.014 79 / 0.9) 0%, transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: "Archivo", sans-serif;
    position: relative;
  }
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(oklch(0.25 0.016 64 / 0.12) 1.5px, transparent 2px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(75% 75% at 72% 40%, black 25%, transparent 80%);
  }
  /* HUD corner ticks */
  .hud { position: absolute; inset: 28px 36px; pointer-events: none; }
  .hud span { position: absolute; width: 18px; height: 18px; border: 0 solid var(--line-strong); }
  .hud .tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
  .hud .tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
  .hud .bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
  .hud .br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

  .stage {
    position: relative;
    height: 100%;
    padding: 64px 76px 56px;
    display: flex;
    flex-direction: column;
  }
  .wordmark {
    font-variation-settings: "wdth" 125;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  .wordmark b { color: var(--cobalt-deep); font-weight: 800; }
  .chip {
    margin-top: 44px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    padding: 9px 16px;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    background: oklch(0.25 0.016 64 / 0.04);
    font-family: "IBM Plex Mono", monospace;
    font-size: 16.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cobalt); }
  h1 {
    margin-top: 26px;
    font-variation-settings: "wdth" 125;
    font-weight: 800;
    font-size: 82px;
    line-height: 0.98;
    letter-spacing: -0.015em;
    text-transform: uppercase;
    max-width: 690px;
  }
  h1 .cb { color: var(--cobalt); }
  .meta {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 1.5px solid var(--line);
    padding-top: 22px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .meta .url { color: var(--cobalt-deep); }
  .meta .sep { color: var(--cobalt); }

  /* Governed grid motif: scattered points settling into a lattice */
  .field { position: absolute; top: 148px; right: 72px; width: 340px; height: 340px; }
  .field svg { display: block; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="hud"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

  <div class="field" id="field"></div>

  <div class="stage">
    <div class="wordmark">ADVANTA<b>365</b></div>
    <div class="chip"><span class="dot"></span>Enterprise Microsoft 365 Framework</div>
    <h1>Microsoft&nbsp;365, <span class="cb">governed and adopted</span> at&nbsp;scale.</h1>
    <div class="meta">
      <span>6 stages <span class="sep">▪</span> 5 modules <span class="sep">▪</span> 4 tracks</span>
      <span class="url">advanta365.com</span>
    </div>
  </div>

  <script>
    // The hero's argument as a still: points mid-settle into a governed grid.
    // Left/looser cells still drift; right cells have locked to the lattice.
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    const SIZE = 340, N = 8, CELL = SIZE / N;
    svg.setAttribute("width", SIZE); svg.setAttribute("height", SIZE);
    svg.setAttribute("viewBox", `-10 -10 ${SIZE + 20} ${SIZE + 20}`);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let c = 0; c <= N; c++) {
      for (let r = 0; r <= N; r++) {
        // Hard settle gradient: left third scattered, right half locked.
        const order = Math.min(1, Math.max(0, (c - 1) / (N - 3)));
        const jitter = (1 - order) * CELL * 0.62;
        const x = c * CELL + (rnd() - 0.5) * jitter * 2;
        const y = r * CELL + (rnd() - 0.5) * jitter * 2;
        const onScan = c === 6; // cobalt scan column
        const s = onScan ? 8 : 5.5 + order * 1.5;
        const rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", x - s / 2); rect.setAttribute("y", y - s / 2);
        rect.setAttribute("width", s); rect.setAttribute("height", s);
        rect.setAttribute("fill", onScan
          ? "oklch(0.52 0.247 266)"
          : `oklch(0.25 0.016 64 / ${0.3 + order * 0.55})`);
        svg.appendChild(rect);
      }
    }
    // keyline ring hinting the governed boundary
    const ring = document.createElementNS(NS, "rect");
    ring.setAttribute("x", 0.75); ring.setAttribute("y", 0.75);
    ring.setAttribute("width", SIZE - 1.5); ring.setAttribute("height", SIZE - 1.5);
    ring.setAttribute("fill", "none");
    ring.setAttribute("stroke", "oklch(0.52 0.247 266 / 0.5)");
    ring.setAttribute("stroke-width", "1.5");
    svg.appendChild(ring);
    document.getElementById("field").appendChild(svg);
  </script>
</body>
</html>
